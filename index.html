<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport">
    <title>acomminos</title>
    <style>
/* color scheme based on base16-ocean by chris kempson */
@font-face {
  font-family: Fixedsys;
  font-display: block;
  src: url('/fonts/FSEX2.ttf');
}

body {
  position: absolute;
  text-align: left;
  background-color: #000;
  font-size: 14pt;
  line-height: 2.0;

  text-transform: lowercase;

  padding: 0;
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: "Fixedsys";
}

#header {
  top: 0;
  left: 0;
  right: 0;
  background-color: #000;
  border-bottom: solid #4f5b66 1px;
  padding: 15px;
}

#header h1 {
  margin: 0;
  font-size: 18pt;
  font-weight: normal;
  color: #c0c5ce;
}

.right {
  float: right;
}

.emphasis {
  color: #a3be8c;
}

a {
  text-decoration: none;
  color: #c0c5ce;
  padding: 5px;
  display: block;
}

a:hover {
  background-color: rgba(255, 255, 255, 0.075);
}

.hint {
  color: #a7adba;
}

.subsection {
  padding-left: 1em;
  padding-right: 1em;
}

#posts a {
  color: #96b5b4;
}

#content h1 {
  margin-top: 0px;
  margin-bottom: 0px;
  font-size: 24pt;
  font-weight: normal;
}

#content {
  padding: 15px;
  color: #c0c5ce;
  font-size: 16pt;
}

@media only screen and (min-width: 800px) {
  #content {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }
}

.divider {
  color: #4f5b66;
  margin-top: 5px;
  margin-bottom: 5px;
}

  </style>
  </head>
  <body>
    <header id="header">
      <h1>Andrew Comminos</h1>
    </header>
    <div id="content">
      <div>
        <div class="divider">[Contact]</div>
        <div id="details" class="subsection">
          <a href="mailto:andrew@comminos.com">email<span class="emphasis right">andrew@comminos.com</span></a>
          <a href="https://www.github.com/acomminos">github<span class="emphasis right">@acomminos</span></a>
          <a href="https://linkedin.com/in/acomminos">linkedin<span class="emphasis right">@acomminos</span></a>
        </div>
        <div class="divider">[Links]</div>
        <div id="posts" class="subsection">
          <a href="/posts/2018-02-21-wined3d-profiling.html">
            check out some <span class="emphasis">wined3d optimizations</span>

          <a href="https://developer.chrome.com/docs/capabilities/web-apis/isinputpending">

          </a>

      </div>
    </div>

</html>
