<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport">
    <title>acomminos</title>
    <style>

:root {
  --separator-color: #4f5b66;
}

/* color scheme based on base16-ocean by chris kempson */
@font-face {
  font-family: Fixedsys;
  font-display: block;
  src: url('/fonts/FSEX2.ttf');
}

/* crt warmup animation */
@keyframes crt-on {
  0% { opacity: 0; filter: brightness(2) blur(2px); }
  40% { opacity: 1; filter: brightness(1.4) blur(0.5px); }
  100% { opacity: 1; filter: brightness(1) blur(0); }
}

@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

@keyframes link-in {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

/* selection colors */
::selection {
  background: #96b5b4;
  color: #2b303b;
}

body {
  position: absolute;
  text-align: left;
  background-color: #060606;
  font-size: 14pt;
  line-height: 2.0;

  text-transform: lowercase;

  padding: 0;
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: "Fixedsys";
  animation: crt-on 0.6s ease-out;
}

/* scanlines */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.15) 2px,
    rgba(0, 0, 0, 0.15) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* blinking cursor */
.role::after {
  content: "█";
  color: #c0c5ce;
  animation: blink 1s step-end infinite;
  margin-left: 2px;
  font-size: 14pt;
}

.role::before {
  content: "█";
  color: transparent;
  margin-left: 2px;
  font-size: 14pt;
}

a {
  text-decoration: none;
  color: #c0c5ce;
  padding: 5px;
  display: block;
  transition: background-color 0.05s, color 0.05s;
}

a:hover {
  background-color: #c0c5ce;
  color: #000;
}

#bio {
  text-align: center;
}

#bio div {
  padding-left: 1em;
  padding-right: 1em;
}

#bio img {
  border: solid var(--separator-color) 1px;
}

#contact {
  padding-left: 1em;
  padding-right: 1em;
  min-width: 10em;
}

#contact a {
  animation: link-in 0.3s ease-out both;
  border-bottom: solid var(--separator-color) 1px;
}

#contact a:nth-child(1) { animation-delay: 0.15s; }
#contact a:nth-child(2) { animation-delay: 0.25s; }
#contact a:nth-child(3) { animation-delay: 0.35s; }
#contact a:nth-child(4) { animation-delay: 0.45s; }

#content {
  padding: 15px;
  color: #c0c5ce;
  font-size: 16pt;
}

@media only screen and (min-width: 800px) {
  #content {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: row;
  }
}
  </style>
  </head>
  <body>
    <div id="content">
      <div id="bio">
        <img src="images/headshot_dithered.png"></img>
        <div>andrew comminos</div>
        <div class="role">software engineer</div>
      </div>
      <div id="contact">
        <a href="mailto:andrew@comminos.com">email</a>
        <a href="https://www.github.com/acomminos">github</a>
        <a href="https://linkedin.com/in/acomminos">linkedin</a>
        <a href="https://x.com/acomminos">x</a>
      </div>
    </div>
  </body>
</html>
