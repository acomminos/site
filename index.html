<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport">
    <title>acomminos</title>
    <style>
/* color scheme based on base16-ocean by chris kempson */
@font-face {
  font-family: Fixedsys;
  font-display: block;
  src: url('/fonts/FSEX2.ttf');
}

body {
  position: absolute;
  text-align: left;
  background-color: #000;
  font-size: 12pt;
  line-height: 1.5;

  text-transform: lowercase;

  padding: 0;
  margin: 0;
  width: 100%;
  height: 100%;
}

#content a {
  color: #a3be8c;
}

a {
  text-decoration: none;
}

a:hover {
  background-color: rgba(255, 255, 255, 0.075);
}

#details > * {
  display: block;
}

.highlight {
  padding: 5px;
}

.post {
  color: #96b5b4;
}

#content h1 {
  margin-top: 0px;
  margin-bottom: 0px;
  font-size: 24pt;
  font-weight: normal;
}

.contact-item {
}

#content {
  padding: 15px;

  font-family: "Fixedsys";
  color: #c0c5ce;
  font-size: 14pt;
}

.post {
  text-align: left;
}

@media only screen and (min-width: 600px) {
  #content {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    border-left: solid #4f5b66 1px;
    padding-left: 15px;
  }

  .post {
    text-align: left;
  }
}

.hint {
  color: #65737e;
}

.divider {
  color: #4f5b66;
  margin-top: 5px;
  margin-bottom: 5px;
}

.typein {
  overflow: hidden;
  white-space: nowrap;
  animation: typing 2s ease-in;
}


@keyframes typing {
  from { width: 0 }
  to { width: 100% }
}

  </style>
  </head>
  <body>
    <div id="content">
      <div>
        <p class="typein">
          Hi, I'm Andrew.
        </p>
        <div class="divider"># Contact</div>
        <div id="details">
          <a class="highlight" href="mailto:andrew@comminos.com">email</a>
          <a class="highlight" href="https://www.github.com/acomminos">github</a>
          <a class="highlight" href="https://ca.linkedin.com/in/acomminos">linkedin</a>
        </div>
        <div class="divider"># Links </div>
        <ul id="posts">
          <li>
            check out some <a href="/posts/2018-02-21-wined3d-profiling.html">wined3d optimizations</a>
          </li>

            learn about optimizing <a href="https://developer.chrome.com/docs/capabilities/web-apis/isinputpending">JS scheduling</a>
